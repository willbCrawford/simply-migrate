version: '3.8'

services:

  web:
    build: .
    ports:
      - "8004:8000"
    volumes:
      - ./app:/app/app         # live reload app code
      - ./test_data/scenario_1:/app/migrations
    environment:
      - REDIS_URL=redis://redis:6379/0
      - MIGRATION_DIR=/app/migrations
    depends_on:
      - redis

  worker:
    build: .
    command: uv run celery -A app.worker.celery_app worker -E -Q migrations,rollback,celery --loglevel=info
    volumes:
      - ./app:/app/app         # live reload app code
      - ./test_data/scenario_1:/app/migrations
    environment:
      - REDIS_URL=redis://redis:6379/0
      - MIGRATION_DIR=/app/migrations
    depends_on:
      - web
      - redis

  redis:
    image: redis:8.4.0
    restart: 'always'
    ports:
      - '6379:6379'

  tenant_1:
    image: postgres
    environment:
      - POSTGRES_USER=tenant
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=tenant
    ports:
      - '5431:5432'

  tenant_2:
    image: postgres
    environment:
      - POSTGRES_USER=tenant
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=tenant
    ports:
      - '5432:5432'

  tenant_3:
    image: postgres
    environment:
      - POSTGRES_USER=tenant
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=tenant
    ports:
      - '5433:5432'

